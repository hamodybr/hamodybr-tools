name: Repair QR runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch QR library and browser adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace(
              'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js',
              'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'
          )
          old = "await QRCode.toCanvas($('#qr',content),v,{width:800,margin:2});"
          new = "const q=$('#qr',content),host=document.createElement('div');new QRCode(host,{text:v,width:800,height:800,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});const src=host.querySelector('canvas');q.width=800;q.height=800;q.getContext('2d').drawImage(src,0,0);"
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix: use browser-compatible QR runtime"
            git push
          fi
