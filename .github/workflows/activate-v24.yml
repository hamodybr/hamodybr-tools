name: Activate HAMODYBR V2.4 links

on:
  push:
    branches: [main]
    paths:
      - 'v2.4-links.js'
      - 'v2.4-links.css'

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate V2.4 JavaScript
        run: node --check v2.4-links.js
      - name: Activate fresh V2.4 assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          if 'v2.4-links.css?v=240' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="v2.4-links.css?v=240">\n</head>')
          if 'v2.4-links.js?v=240' not in s:
              s = s.replace('</body>', '<script src="v2.4-links.js?v=240"></script>\n</body>')
          s = s.replace("./sw.js?v=220", "./sw.js?v=240")
          p.write_text(s)

          swp = Path('sw.js')
          sw = swp.read_text()
          sw = re.sub(r"const CACHE='[^']+';", "const CACHE='hamodybr-tools-v2-4';", sw, count=1)
          if "'./v2.4-links.css?v=240'" not in sw:
              sw = sw.replace("'./v2.1-ios-multipicker.js?v=220']", "'./v2.1-ios-multipicker.js?v=220','./v2.4-links.css?v=240','./v2.4-links.js?v=240']")
          swp.write_text(sw)
          PY
      - name: Validate service worker
        run: node --check sw.js
      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "V2.4 already active"
          else
            git commit -m "chore(v2.4): activate clean links and sharing"
            git push
          fi
