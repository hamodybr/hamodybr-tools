name: Patch HAMODYBR V2.2 index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch versioned assets
        shell: bash
        run: |
          sed -i 's|<link rel="stylesheet" href="v2.css">|<link rel="stylesheet" href="v2.css?v=220">|g' index.html
          sed -i 's|<script src="v2.js"></script>|<script src="v2.js?v=220"></script>|g' index.html
          sed -i 's|<script src="v2.1-ios-multipicker.js"></script>|<script src="v2.1-ios-multipicker.js?v=220"></script>|g' index.html
          sed -i "s|navigator.serviceWorker.register('./sw.js')|navigator.serviceWorker.register('./sw.js?v=220')|g" index.html
      - name: Validate scripts
        run: |
          node --check v2.js
          node --check v2.1-ios-multipicker.js
          node --check sw.js
      - name: Commit V2.2 index patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index already patched"
          else
            git commit -m "fix: version V2.2 assets and force fresh service worker"
            git push
          fi
