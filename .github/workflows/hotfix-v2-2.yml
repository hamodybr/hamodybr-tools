name: Hotfix HAMODYBR Tools V2.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate multi-photo picker
        run: node --check v2.1-ios-multipicker.js

      - name: Force fresh V2.2 assets and replace cache strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Cache-bust the progressive enhancement assets.
          s = s.replace('<link rel="stylesheet" href="v2.css">', '<link rel="stylesheet" href="v2.css?v=220">')
          s = s.replace('<script src="v2.js"></script>', '<script src="v2.js?v=220"></script>')
          s = s.replace('<script src="v2.1-ios-multipicker.js"></script>', '<script src="v2.1-ios-multipicker.js?v=220"></script>')

          # Force Safari/iOS to treat this as a fresh service-worker script URL.
          s = re.sub(
              r"navigator\.serviceWorker\.register\((['\"])\.?/?sw\.js\1\)",
              "navigator.serviceWorker.register('./sw.js?v=220')",
              s,
          )

          # Add a safe one-time reload when the new worker takes control.
          marker = 'hb-v22-controller-reload'
          if marker not in s:
              snippet = '''<script id="hb-v22-controller-reload">\nif('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('controllerchange',()=>{try{if(!sessionStorage.getItem('hb-v22-reloaded')){sessionStorage.setItem('hb-v22-reloaded','1');location.reload()}}catch(_){location.reload()}})}\n</script>\n'''
              s = s.replace('</body>', snippet + '</body>')

          p.write_text(s)

          sw = r'''const CACHE='hamodybr-tools-v2-2';
const FALLBACK='./index.html';
const CORE=['./index.html','./manifest.webmanifest','./icon.svg','./v2.css?v=220','./v2.js?v=220','./v2.1-ios-multipicker.js?v=220'];

self.addEventListener('install',event=>{
  self.skipWaiting();
  event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(CORE)).catch(()=>{}));
});

self.addEventListener('activate',event=>{
  event.waitUntil(
    caches.keys()
      .then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key))))
      .then(()=>self.clients.claim())
  );
});

self.addEventListener('fetch',event=>{
  if(event.request.method!=='GET') return;
  const req=event.request;

  if(req.mode==='navigate'){
    event.respondWith(
      fetch(req,{cache:'no-store'})
        .then(response=>{
          if(response&&response.ok){
            const copy=response.clone();
            caches.open(CACHE).then(cache=>cache.put(FALLBACK,copy)).catch(()=>{});
          }
          return response;
        })
        .catch(()=>caches.match(FALLBACK))
    );
    return;
  }

  event.respondWith(
    fetch(req)
      .then(response=>{
        if(response&&response.ok&&new URL(req.url).origin===self.location.origin){
          const copy=response.clone();
          caches.open(CACHE).then(cache=>cache.put(req,copy)).catch(()=>{});
        }
        return response;
      })
      .catch(()=>caches.match(req))
  );
});
'''
          Path('sw.js').write_text(sw)
          PY

      - name: Validate generated service worker
        run: node --check sw.js

      - name: Commit V2.2 hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "V2.2 hotfix already active"
          else
            git commit -m "fix: force fresh V2.2 and iPhone multi-photo picker"
            git push
          fi
