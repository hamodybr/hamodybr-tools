name: Forge Add Only — Original video preservation
on:
  pull_request:
    paths:
      - 'forge-audio-lab/forge-track.mjs'
      - 'forge-audio-lab/index.html'
      - 'forge-audio-lab/today-mode.mjs'
      - 'forge-audio-lab/today-mode.test.mjs'
      - 'forge-audio-lab/haze52-patch.test.mjs'
      - 'forge-audio-lab/haze52-mode.test.mjs'
      - 'forge-audio-lab/haze52-patch.mjs'
      - 'forge-audio-lab/haze52-mode.mjs'
      - 'forge-audio-lab/original.html'
      - 'forge-audio-lab/forge-original.test.mjs'
      - '.github/workflows/forge-original-tests.yml'
  workflow_dispatch:
jobs:
  lossless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg/FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check syntax
        run: |
          node --check forge-audio-lab/forge-track.mjs
          node --check forge-audio-lab/forge-original.test.mjs
          node --check forge-audio-lab/today-mode.mjs
          node --check forge-audio-lab/today-mode.test.mjs
          node --check forge-audio-lab/haze52-mode.mjs
          node --check forge-audio-lab/haze52-patch.mjs
          node --check forge-audio-lab/haze52-mode.test.mjs
          node --check forge-audio-lab/haze52-patch.test.mjs
      - name: Test lossless MOV/MP4 packet copy and Today preset
        run: node --test forge-audio-lab/forge-original.test.mjs forge-audio-lab/today-mode.test.mjs forge-audio-lab/haze52-mode.test.mjs forge-audio-lab/haze52-patch.test.mjs
